name: jitter.yml – Test GitHub Cron Jitter

on:
  schedule:
     - cron: 0,43 * 28,29 10 * #

permissions:
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Jitter Test
        run: |
          echo `date +%F %T.%L`
