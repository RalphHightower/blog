name: jitter.yml – Test GitHub Cron Jitter

on:
  schedule:
     - cron: 0,43 * 29,30 10 *

permissions:
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Jitter Test
        run: |
          echo `date +'%F %T.%L'`
          echo github.event.schedule
