name: Test GitHub Cron Jitter

on:
  schedule:
     0,43 * 28,29 10 *

permissions:
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Jitter Test
        run: |
          echo `date +%F %T.%L`
