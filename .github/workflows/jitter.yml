name: jitter.yml – Test GitHub Cron Jitter

on:
  schedule:
     - cron: 0,43 * 29,30 10 *

permissions:
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Jitter Test
        run: |
          echo `date +'%F %T.%L'`
          echo github.event.schedule
