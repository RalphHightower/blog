name: jitter.yml – Test GitHub Cron Jitter

on:
  schedule:
     - cron: 0,43 * 29,30 10 *

permissions:
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Jitter Test
        run: |
          echo `date +'%F %T.%L'`
          echo github.event.schedule
