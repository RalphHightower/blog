name: Blog Federal Reserve FOMC Release

on:
  schedule:
    - cron: 58 17 28 10 *
    - cron: 58 18 9 12 *
    # [The Fed - 2027 FOMC Meeting calendar](https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm#45694)
    - cron: 58 18 27 1 *
    - cron: 58 17 17 3 *
    - cron: 58 17 28 4 *
    - cron: 58 17 9 6 *
    - cron: 58 17 28 7 *
    - cron: 58 17 15 9 *
    - cron: 58 17 27 10 *
    - cron: 58 18 8 12 *
    #workflow_dispatch:

permissions:
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Blog Federal Reserve FOMC Release
        run: |
          new_issue_url=$(gh issue create \
            --title "$(date +%F) $TITLE" \
            --assignee "$ASSIGNEES" \
            --label "$LABELS" \
            --body "$BODY")
          if [[ $PINNED == true ]]; then
            gh issue pin "$new_issue_url"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "FOMC Release"
          ASSIGNEES: "RalphHightower"
          LABELS: "blog,article – economy,article – government,article – finance,article – politics"
          BODY: |

            - [ ] [Federal Reserve Board - News & Events](https://www.federalreserve.gov/newsevents.htm)

          PINNED: false
          CLOSE_PREVIOUS: false
